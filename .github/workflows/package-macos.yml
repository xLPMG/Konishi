name: Package macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install icon generator dependency
        run: python -m pip install Pillow

      - name: Build app bundle
        run: ./run.sh release --no-launch

      # Configure all five secrets for a Developer ID-signed distribution:
      # MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID.
      - name: Sign app with Developer ID when credentials are configured
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          provided=0
          for value in \
            "$MACOS_CERTIFICATE" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD" \
            "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then
              ((provided += 1))
            fi
          done

          if ((provided == 0)); then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured; the DMG will be ad-hoc signed and Gatekeeper may block it."
            exit 0
          fi
          if ((provided != 5)); then
            echo "::error::Configure all five signing secrets, or none of them."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/konishi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          trap 'security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; rm -f "$CERTIFICATE_PATH"' EXIT
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "::error::The imported certificate has no Developer ID Application identity."
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --sign "$identity" --entitlements Konishi.entitlements Konishi.app
          codesign --verify --deep --strict --verbose=2 Konishi.app
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Konishi.app/Contents/Info.plist)"
          architecture="$(uname -m)"
          short_sha="$(git rev-parse --short HEAD)"
          filename="Konishi-${version}-macos-${architecture}-${short_sha}.dmg"
          hdiutil create -volname Konishi -srcfolder Konishi.app \
            -ov -format UDZO "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Konishi-macos-${architecture}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG_FILE: ${{ steps.dmg.outputs.filename }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.artifact_name }}
          path: ${{ steps.dmg.outputs.filename }}
          if-no-files-found: error
          retention-days: 30